<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" fill="none">
  <title>Contour — dark silver sculptural loops</title>
  <defs>
    <linearGradient id="edge" x1="130" y1="0" x2="1430" y2="1100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5d9e1" stop-opacity=".65"/>
      <stop offset=".26" stop-color="#767e8e" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#e4e8ef" stop-opacity=".6"/>
      <stop offset="1" stop-color="#666d7d" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="body" x1="360" y1="70" x2="1100" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181a20"/>
      <stop offset=".34" stop-color="#050608"/>
      <stop offset=".69" stop-color="#111318"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="flow" d="M-160 110H840C1000 110 1000 310 840 310H480C290 310 210 400 210 585V1240H20V585C20 300 175 120 460 120"/>
    <path id="lower" d="M390 1200V720C390 620 455 560 555 560H840C980 560 980 750 840 750H670C535 750 535 950 670 950H1780"/>
    <path id="right" d="M1260-150V470C1260 620 1470 620 1470 470V310C1470 170 1660 170 1660 310V1120"/>
  </defs>
  <rect width="1600" height="1100" fill="#040506"/>
  <g stroke="url(#edge)" stroke-width="175" stroke-linecap="round" stroke-linejoin="round" opacity=".58" filter="url(#halo)">
    <use href="#flow"/><use href="#lower"/><use href="#right"/>
  </g>
  <g stroke="url(#edge)" stroke-width="153" stroke-linecap="round" stroke-linejoin="round" opacity=".36" filter="url(#soft)">
    <use href="#flow"/><use href="#lower"/><use href="#right"/>
  </g>
  <g stroke="url(#edge)" stroke-width="150" stroke-linecap="round" stroke-linejoin="round">
    <use href="#flow"/><use href="#lower"/><use href="#right"/>
  </g>
  <g stroke="url(#body)" stroke-width="147" stroke-linecap="round" stroke-linejoin="round">
    <use href="#flow"/><use href="#lower"/><use href="#right"/>
  </g>
</svg>
