<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title description">
  <title id="title">Архитектура «Школы действия» в MAX</title>
  <desc id="description">Три маршрута. Демо-роль из MAX открывает веб-школу. Личный кабинет обращается к отдельному ядру бота. Бот забирает уведомления из очереди школы и отправляет их в MAX.</desc>
  <defs>
    <linearGradient id="canvas" x2="1" y2="1">
      <stop stop-color="#e7edfc"/>
      <stop offset="0.58" stop-color="#f6f7fb"/>
      <stop offset="1" stop-color="#e8e9f8"/>
    </linearGradient>
    <linearGradient id="glass" x2="0.7" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f1f4fc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#465f9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="690" rx="32" fill="url(#canvas)"/>
  <path d="M440 0c-6 91 65 136 200 158V0Z" fill="#d7e1ff" opacity=".65"/>
  <g font-family="system-ui, 'Segoe UI', sans-serif" fill="#182643">
