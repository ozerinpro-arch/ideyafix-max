      <rect x="31" y="294" width="578" height="154" rx="22" fill="#dce4f6"/>
      <rect x="31" y="291" width="578" height="154" rx="22" fill="url(#glass)" stroke="#fff"/>
      <rect x="53" y="311" width="42" height="42" rx="13" fill="#e9e3fa"/>
      <text x="74" y="340" font-size="22" font-weight="700" fill="#5b3d9c" text-anchor="middle">02</text>
