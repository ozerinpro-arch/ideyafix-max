      <rect x="53" y="136" width="42" height="42" rx="13" fill="#e2ebff"/>
      <text x="74" y="165" font-size="22" font-weight="700" fill="#2855aa" text-anchor="middle">01</text>
      <text x="111" y="165" font-size="28" font-weight="700">Демо для жюри</text>
      <rect x="53" y="191" width="141" height="40" rx="12" fill="#edf2ff" stroke="#d8e2f7"/>
      <rect x="249" y="191" width="160" height="40" rx="12" fill="#edf2ff" stroke="#d8e2f7"/>
      <rect x="464" y="191" width="123" height="40" rx="12" fill="#edf2ff" stroke="#d8e2f7"/>
